<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Urban Threads | Shop</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">URBAN THREADS</a>

    <nav>
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="login.html">Login</a>
      <a href="cart.html">Cart</a>
    </nav>
  </header>

  <main class="shop-page">
    <section class="shop-heading">
      <p class="eyebrow">NEW SEASON</p>
      <h1>Shop the collection</h1>
      <p>Everyday streetwear made for your style.</p>
    </section>

    <section class="shop-controls">
      <input
        type="search"
        id="search-input"
        placeholder="Search products..."
      />

      <select id="category-filter">
        <option value="all">All categories</option>
        <option value="Hoodies">Hoodies</option>
        <option value="T-shirts">T-shirts</option>
        <option value="Sneakers">Sneakers</option>
        <option value="Accessories">Accessories</option>
      </select>
    </section>

    <section id="product-grid" class="product-grid">
      <p>Loading products...</p>
    </section>
  </main>

  <script type="module" src="./shop.js"></script>
  <script type="module" src="./main.js"></script>
  
</body>
</html>
